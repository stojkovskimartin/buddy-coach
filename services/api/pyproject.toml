[project]
name = "buddy-coach-api"
version = "0.1.0"
description = "Buddy Coach backend: REST API, domain modules and the coach agent network"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "pyjwt>=2.15",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddy_coach"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF", "PT", "C4", "RET"]
ignore = ["B008"]  # FastAPI uses function calls in default args (Depends)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["buddy_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a PostgreSQL database (BUDDY_TEST_DATABASE_URL)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["buddy_coach"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
