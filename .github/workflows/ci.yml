# Runs on every push and pull request: backend lint, types and tests against a real Postgres,
# frontend type checks and tests, and API contract drift (generated client must be committed).
name: CI

# Feature branches run through their pull request; main runs on every push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main is checked; superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy
          POSTGRES_DB: buddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buddy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      BUDDY_TEST_DATABASE_URL: postgresql+asyncpg://buddy:buddy@localhost:5432/buddy_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  frontend:
    name: Frontend (types, tests, contract drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: API contract drift
        run: |
          (cd services/api && uv sync --locked)
          pnpm api:generate
          # status also catches new untracked files, which git diff would miss.
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            git status --porcelain -- packages/api-client
            git diff -- packages/api-client
            echo "::error::Generated API client is out of date. Run 'pnpm api:generate' and commit."
            exit 1
          fi
